# Which USB device is which part of the cell. Devices are named by their
# serial number or USB id, never by /dev name or camera index: those change
# when a cable moves to another socket. Written by `trashdrop rig identify`;
# `trashdrop rig check` verifies everything is plugged in and answering.

[overhead]
camera = "046d:08e5"

# Where items are put down and looked for, in cm in the calibration sheet's frame
# (x to the right of the printed page, y towards its top). By default the sheet's own
# footprint: lay the sheet where the zone should be, calibrate, take it away.
[pick_zone]
x = 0
y = 0
width = 30
height = 21
corners = [[-11.94, 10.57], [11.68, 9.22], [12.13, -9.90], [-11.87, -9.90]]  # the taped zone: far left, far right, near right, near left

# Where the overhead camera sees the tape corners, pixels (from `camera tape`).
[tape]
far_left = [763.9, 534.9]
far_right = [1116.3, 570.5]
near_right = [1088.9, 884.6]
near_left = [732.3, 865.4]

[left]
label = "F01"          # written on the arm
bus = "5AAF219965"       # servo adapter serial number
camera = "2993:0858"      # wrist camera
max_speed = 100             # degrees per second, every move
descent_speed = 75         # degrees per second, final approach to an item
wrist_roll_offset = -80.0  # model roll = LeRobot roll + this (from `rig roll`)
touches = { far_left = [22.31, -11.93, -2.09], far_right = [20.30, -35.67, -2.92], near_right = [0.63, -32.80, -2.70], near_left = [2.13, -9.21, -0.71] }  # tape corners touched, cm in the arm's frame
touch_poses = { far_left = [34.5, 38.9, -17.6, 77.8, 28.8], far_right = [66.4, 79.0, -69.4, 38.1, -14.6], near_right = [97.0, 70.1, -69.3, 72.4, -14.4], near_left = [105.5, -36.7, 67.6, 63.0, -13.9] }  # joint degrees of each touch: pan, lift, elbow, wrist flex, wrist roll
sheet = { x = 11.34, y = -22.40, yaw = -95.14, table_z = -0.36, dz_dx = -0.0318, dz_dy = 0.0617 }  # from `rig touch`: cm, deg, table plane

[right]
label = "F02"          # written on the arm
bus = "5AAF220303"       # servo adapter serial number
camera = "10bb:2b08"      # wrist camera
max_speed = 100             # degrees per second, every move
descent_speed = 75         # degrees per second, final approach to an item
wrist_roll_offset = 5.0  # model roll = LeRobot roll + this (from `rig roll`)
touches = { far_left = [19.71, 33.39, -2.25], far_right = [21.21, 9.93, -2.20], near_right = [3.41, 4.55, -0.99], near_left = [-0.41, 28.61, -1.95] }  # tape corners touched, cm in the arm's frame
touch_poses = { far_left = [-63.6, 67.7, -58.6, 46.7, -64.3], far_right = [-27.9, 5.4, 35.1, 39.6, -64.2], near_right = [-87.5, -31.9, 70.9, 69.9, -64.2], near_left = [-97.2, 33.2, -6.1, 43.6, -64.3] }  # joint degrees of each touch: pan, lift, elbow, wrist flex, wrist roll
sheet = { x = 10.98, y = 19.12, yaw = -79.47, table_z = -1.02, dz_dx = -0.0315, dz_dy = -0.0252 }  # from `rig touch`: cm, deg, table plane
