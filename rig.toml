# Which USB device is which part of the cell. Devices are named by their
# serial number or USB id, never by /dev name or camera index: those change
# when a cable moves to another socket. Written by `trashdrop rig identify`;
# `trashdrop rig check` verifies everything is plugged in and answering.

[overhead]
camera = "046d:08e5"

# Where items are put down and looked for, in cm in the calibration sheet's frame
# (x to the right of the printed page, y towards its top). By default the sheet's own
# footprint: lay the sheet where the zone should be, calibrate, take it away.
[pick_zone]
x = 0
y = 0
width = 30
height = 21
corners = [[-13.46, 13.52], [13.28, 14.66], [15.95, -14.09], [-15.77, -14.09]]  # the taped zone: far left, far right, near right, near left

# Where the overhead camera sees the tape corners, pixels (from `camera tape`).
[tape]
far_left = [731.0, 399.1]
far_right = [1168.5, 437.5]
near_right = [1132.8, 825.6]
near_left = [692.6, 785.8]

[left]
label = "F01"          # written on the arm
bus = "5AAF219965"       # servo adapter serial number
camera = "2993:0858"      # wrist camera
max_speed = 30             # degrees per second, every move
touches = { far_left = [33.84, -9.56, -3.33], near_right = [3.63, -35.98, -3.20], near_left = [6.54, -4.97, -0.26] }  # tape corners touched, cm in the arm's frame
sheet = { x = 19.12, y = -21.70, yaw = -95.36, table_z = 0.88, dz_dx = -0.0950, dz_dy = 0.1037 }  # from `rig touch`: cm, deg, table plane

[right]
label = "F02"          # written on the arm
bus = "5AAF220303"       # servo adapter serial number
camera = "10bb:2b08"      # wrist camera
max_speed = 30             # degrees per second, every move
touches = { far_right = [33.92, 9.02, -2.36], near_right = [5.62, 3.13, -0.86], near_left = [2.31, 35.26, -2.17] }  # tape corners touched, cm in the arm's frame
sheet = { x = 17.97, y = 20.73, yaw = -84.12, table_z = -0.47, dz_dx = -0.0436, dz_dy = -0.0453 }  # from `rig touch`: cm, deg, table plane
