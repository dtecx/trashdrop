[project]
name = "trashdrop"
version = "0.3.0"
description = "Two-arm SO-101 virtual trash-sorting cell: simulation, perception and dataset tooling"
readme = "README.md"
requires-python = ">=3.11"
# Nothing by default: planning and station are pure Python, so a teammate who
# only reads the layout or runs the dispatcher installs nothing at all.
dependencies = []

[project.optional-dependencies]
# Dataset capture, autolabelling and review on the rig. This is what the people
# shooting photos need, and it does not pull in MuJoCo.
dataset = [
    "numpy>=1.26",
    "opencv-python>=4.9",
]
# The virtual cell.
simulation = [
    "mujoco>=3.3",
    "numpy>=1.26",
    "opencv-python>=4.9",
]
# Direct USB control of the webcam (focus, exposure, white balance). macOS uses
# a small IOKit helper compiled on first use and needs no Python packages;
# Linux goes through libusb, which comes as a wheel.
camera = [
    "pyusb>=1.2; sys_platform == 'linux'",
    "libusb-package>=1.0; sys_platform == 'linux'",
]
# Everything the capture rig needs: the dataset tools plus camera control.
rig = [
    "trashdrop[dataset,camera]",
]
# Run an exported crop classifier without installing a training stack.
classifier = [
    "onnxruntime>=1.17",
]
# Teleoperation and demonstration recording with the leader arm. Heavy and
# deliberately opt-in -- see docs/APPROACH.md for when this is worth it.
teleop = [
    "lerobot>=0.1",
]

[project.scripts]
trashdrop = "trashdrop.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trashdrop"]

[tool.uv]
default-groups = []

[dependency-groups]
dev = [
    "pytest>=8.0",
]
